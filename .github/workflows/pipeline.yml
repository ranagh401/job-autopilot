name: job pipeline

# GitHub Actions is the scheduler: unlike a free web host it never
# sleeps. A run takes a few minutes, so hourly stays well inside the
# 2,000 free minutes/month for a private repo.
on:
  schedule:
    - cron: "20 * * * *"      # hourly, at :20 past (UTC)
  workflow_dispatch:           # lets you trigger a run by hand
    inputs:
      steps:
        description: "Steps to run (blank = all)"
        required: false
        default: ""

concurrency:
  group: job-pipeline          # never two runs writing at once
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: job-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: job-portal/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          # Behaviour (safe defaults; override as repo variables)
          AUTO_SEND: ${{ vars.AUTO_SEND || 'true' }}
          AUTO_SEND_MIN_SCORE: ${{ vars.AUTO_SEND_MIN_SCORE || '65' }}
          DAILY_EMAIL_CAP: ${{ vars.DAILY_EMAIL_CAP || '50' }}
          SEND_WINDOW: ${{ vars.SEND_WINDOW || '0-24' }}
          MATCH_THRESHOLD: ${{ vars.MATCH_THRESHOLD || '65' }}
          # Chromium is not installed here, so form filling is skipped.
          BROWSER_APPLY: "false"
        run: python run_pipeline.py ${{ github.event.inputs.steps }}

      - name: Upload tailored resumes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resumes-${{ github.run_number }}
          path: job-portal/data/resumes/
          retention-days: 14
          if-no-files-found: ignore
